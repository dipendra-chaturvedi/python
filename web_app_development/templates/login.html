{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="POST" action="{{ url_for('auth.login') }}">

    <input
        type="text"
        name="username"
        placeholder="Enter username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
