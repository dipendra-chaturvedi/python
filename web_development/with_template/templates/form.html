{% extends "base.html" %}

{% block title %}
Add Employee
{% endblock %}

{% block content %}

<h1>Add Employee</h1>

<form method="POST" action="/add">

    <input
        type="text"
        name="name"
        placeholder="Enter employee name"
    >

    <input
        type="number"
        name="salary"
        placeholder="Enter salary"
    >

    <button type="submit">
        Submit
    </button>

</form>

<button type="button" onclick="showMessage()">
    Test JavaScript
</button>

{% endblock %}
