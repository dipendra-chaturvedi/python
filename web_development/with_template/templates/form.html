<!DOCTYPE html>
<html>
<head>
    <title>Employee Form</title>
</head>

<body>

    <h1>Add Employee</h1>

    <form method="POST" action="/add">

        <input
            type="text"
            name="name"
            placeholder="Enter employee name"
        >

        <input
            type="number"
            name="salary"
            placeholder="Enter salary"
        >

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
